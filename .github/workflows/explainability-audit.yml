name: SHAP-LIME concordance audit (50 cases)
on:
  push:
    branches: [main]
    paths:
      - 'run_explanations.py'
      - 'src/explainability.py'
      - 'run_experiments.py'
      - 'src/experiment_config.py'
      - '.github/workflows/explainability-audit.yml'
  workflow_dispatch:
jobs:
  explain:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python run_explanations.py --output results/explanations --n 50
      - uses: actions/upload-artifact@v4
        with:
          name: shap-lime-50-cases
          path: results/explanations/
          retention-days: 30